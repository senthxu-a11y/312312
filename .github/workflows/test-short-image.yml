name: Test Short NPC Prompt

on:
  pull_request:
    branches: [main]
    paths:
      - prompts/short-test.txt
      - runs/short-test-trigger.txt
      - .github/workflows/test-short-image.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - name: Generate concise prompt model comparison
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, urllib.parse, time
          prompt = pathlib.Path('prompts/short-test.txt').read_text().strip()
          encoded = urllib.parse.quote(prompt, safe='')
          out = pathlib.Path('model-tests')
          out.mkdir(exist_ok=True)
          tests = [
              ('image-flux', f'https://image.pollinations.ai/prompt/{encoded}?model=flux&width=768&height=1024&seed=9914&nologo=true&enhance=true'),
              ('image-turbo', f'https://image.pollinations.ai/prompt/{encoded}?model=turbo&width=768&height=1024&seed=9915&nologo=true&enhance=true'),
              ('image-seedream', f'https://image.pollinations.ai/prompt/{encoded}?model=seedream&width=768&height=1024&seed=9916&nologo=true&enhance=true'),
              ('image-gptimage', f'https://image.pollinations.ai/prompt/{encoded}?model=gptimage&width=768&height=1024&seed=9917&nologo=true&enhance=true'),
              ('image-zimage', f'https://image.pollinations.ai/prompt/{encoded}?model=zimage&width=768&height=1024&seed=9918&nologo=true&enhance=true'),
              ('image-nova', f'https://image.pollinations.ai/prompt/{encoded}?model=nova-canvas&width=768&height=1024&seed=9919&nologo=true&enhance=true'),
              ('legacy-page', f'https://pollinations.ai/p/{encoded}?width=768&height=1024&seed=9920&nologo=true'),
          ]
          for name, url in tests:
              target = out / f'{name}.jpg'
              try:
                  subprocess.run(['curl','-L','--fail','--silent','--show-error','--max-time','360','-A','Mozilla/5.0','-o',str(target),url],check=True)
                  subprocess.run(['file',str(target)],check=True)
              except Exception as exc:
                  print(f'{name} failed: {exc}')
                  if target.exists():
                      target.rename(out / f'{name}.response')
              time.sleep(4)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: short-npc-prompt-test
          path: model-tests
          if-no-files-found: error
          compression-level: 0
