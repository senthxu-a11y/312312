name: Test Short NPC Prompt

on:
  pull_request:
    branches: [main]
    paths:
      - prompts/short-test.txt
      - runs/short-test-trigger.txt
      - .github/workflows/test-short-image.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - name: Generate one concise test image
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, urllib.parse
          prompt = pathlib.Path('prompts/short-test.txt').read_text().strip()
          encoded = urllib.parse.quote(prompt, safe='')
          url = f'https://image.pollinations.ai/prompt/{encoded}?model=flux&width=768&height=1024&seed=9914&nologo=true&enhance=true'
          subprocess.run(['curl','-L','--fail','--silent','--show-error','--max-time','300','-A','Mozilla/5.0','-o','short-test.jpg',url],check=True)
          subprocess.run(['file','short-test.jpg'],check=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: short-npc-prompt-test
          path: short-test.jpg
          compression-level: 0
