name: Compare NPC Image Models

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Generate comparison images
        run: python3 .github/scripts/compare_image_models.py
      - name: Inspect outputs
        shell: bash
        run: |
          set -euo pipefail
          find model_compare -type f -name '*.jpg' -print0 | xargs -0 file
          du -h model_compare/*
      - name: Upload comparison
        uses: actions/upload-artifact@v4
        with:
          name: npc-image-model-comparison
          path: model_compare
          if-no-files-found: error
          compression-level: 0
