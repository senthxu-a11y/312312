name: Generate NPC Art Batch 02

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Generate NPC-007 through NPC-016
        run: python3 .github/scripts/generate_npc_batch_02.py
      - name: Validate outputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(find npc_art_batch_02 -type f -name 'NPC-*.jpg' | wc -l)" -eq 10
          find npc_art_batch_02 -type f -name 'NPC-*.jpg' -print0 | xargs -0 file
          du -h npc_art_batch_02/*
      - name: Upload NPC batch
        uses: actions/upload-artifact@v4
        with:
          name: npc-art-batch-02
          path: npc_art_batch_02
          if-no-files-found: error
          compression-level: 0
