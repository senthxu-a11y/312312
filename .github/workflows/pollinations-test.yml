name: Test Hugging Face FLUX NPC Art

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Gradio client
        run: python3 -m pip install --upgrade gradio_client
      - name: Generate NPC-007 with FLUX
        run: python3 .github/scripts/test_hf_flux.py
      - name: Inspect output
        shell: bash
        run: |
          set -euo pipefail
          find hf_flux_test -type f -print0 | xargs -0 file
          du -h hf_flux_test/*
      - name: Upload output
        uses: actions/upload-artifact@v4
        with:
          name: hf-flux-npc-test
          path: hf_flux_test
          if-no-files-found: error
          compression-level: 0
