name: Generate High Quality NPC Art Batch 02

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Gradio client
        run: python3 -m pip install --upgrade gradio_client
      - name: Generate NPC-007 through NPC-016
        run: python3 .github/scripts/generate_hf_flux_batch_02.py
      - name: Inspect outputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(find hf_flux_batch_02 -type f | wc -l)" -eq 10
          find hf_flux_batch_02 -type f -print0 | xargs -0 file
          du -h hf_flux_batch_02/*
      - name: Upload NPC batch
        uses: actions/upload-artifact@v4
        with:
          name: hf-flux-npc-batch-02
          path: hf_flux_batch_02
          if-no-files-found: error
          compression-level: 0
