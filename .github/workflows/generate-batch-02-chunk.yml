name: Generate NPC Art Batch 02 Chunk

on:
  pull_request:
    branches: [main]
    paths:
      - prompts/batch-02.json
      - runs/batch-02-chunk.txt
      - .github/workflows/generate-batch-02-chunk.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet --upgrade gradio_client pillow
      - name: Generate chunk
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import shutil
          import time
          from PIL import Image
          from gradio_client import Client

          prompts = json.loads(pathlib.Path('prompts/batch-02.json').read_text(encoding='utf-8'))
          ids = [x.strip() for x in pathlib.Path('runs/batch-02-chunk.txt').read_text().replace('\n', ',').split(',') if x.strip()]
          assert 1 <= len(ids) <= 2, f'chunk must contain 1-2 NPC IDs: {ids}'
          out = pathlib.Path('generated-chunk')
          if out.exists():
              shutil.rmtree(out)
          out.mkdir(parents=True)
          client = Client('black-forest-labs/FLUX.1-schnell', httpx_kwargs={'timeout': 300.0})

          for npc_id in ids:
              prompt = prompts[npc_id] + ' One single character only, complete hands and role props, no duplicate person, no text, no UI, premium polished professional quality.'
              seed = 9100 + int(npc_id.split('-')[1])
              result = client.predict(
                  prompt=prompt,
                  seed=seed,
                  randomize_seed=False,
                  width=1024,
                  height=1365,
                  num_inference_steps=4,
                  api_name='/infer',
              )
              source = result[0] if isinstance(result, (tuple, list)) else result
              if isinstance(source, dict):
                  source = source.get('path') or source.get('url')
              if not isinstance(source, str) or not os.path.exists(source):
                  raise RuntimeError(f'Unsupported result for {npc_id}: {source!r}')
              target = out / f'{npc_id}.jpg'
              with Image.open(source) as im:
                  if im.width < 900 or im.height < 1200:
                      raise RuntimeError(f'{npc_id} image too small: {im.size}')
                  im.convert('RGB').save(target, 'JPEG', quality=95, optimize=True)
              print(npc_id, target.stat().st_size)
              time.sleep(3)
          PY
      - name: Validate chunk
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          from PIL import Image
          ids = [x.strip() for x in pathlib.Path('runs/batch-02-chunk.txt').read_text().replace('\n', ',').split(',') if x.strip()]
          files = sorted(pathlib.Path('generated-chunk').glob('NPC-*.jpg'))
          assert [p.stem for p in files] == sorted(ids), ([p.stem for p in files], sorted(ids))
          for path in files:
              with Image.open(path) as im:
                  assert im.width >= 900 and im.height >= 1200
                  print(path.name, im.size, path.stat().st_size)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: npc-art-${{ github.head_ref }}
          path: generated-chunk
          if-no-files-found: error
          compression-level: 0
