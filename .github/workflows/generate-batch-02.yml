name: Generate NPC Art Batch 02

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/generate-batch-02.yml
  pull_request:
    branches: [main]
    paths:
      - prompts/batch-02.json
      - .github/workflows/generate-batch-02.yml
      - runs/batch-02-trigger.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FLUX client and image tools
        run: pip install --quiet --upgrade gradio_client pillow requests

      - name: Generate two candidates for NPC-011 through NPC-020
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import shutil
          import time
          from PIL import Image
          from gradio_client import Client

          prompts = json.loads(pathlib.Path('prompts/batch-02.json').read_text(encoding='utf-8'))
          out = pathlib.Path('assets/batch-02-candidates')
          out.mkdir(parents=True, exist_ok=True)

          client = Client('black-forest-labs/FLUX.1-schnell', httpx_kwargs={'timeout': 300.0})

          def extract_path(result):
              candidate = result[0] if isinstance(result, (tuple, list)) else result
              if isinstance(candidate, dict):
                  candidate = candidate.get('path') or candidate.get('url')
              if not isinstance(candidate, str) or not os.path.exists(candidate):
                  raise RuntimeError(f'Unsupported FLUX result: {candidate!r}')
              return candidate

          for idx, (npc_id, prompt) in enumerate(prompts.items(), start=1):
              for variant_idx, variant in enumerate(('A', 'B')):
                  target = out / f'{npc_id}-{variant}.jpg'
                  seed = 8400 + idx * 10 + variant_idx
                  final_prompt = (
                      prompt
                      + ' One single character only, no duplicate person, no extra limbs, complete hands and role props, '
                        'clean silhouette, polished professional quality matching a premium cozy farming mobile game.'
                  )
                  last_error = None
                  for attempt in range(1, 4):
                      try:
                          result = client.predict(
                              prompt=final_prompt,
                              seed=seed + attempt - 1,
                              randomize_seed=False,
                              width=1024,
                              height=1365,
                              num_inference_steps=4,
                              api_name='/infer',
                          )
                          source = extract_path(result)
                          with Image.open(source) as im:
                              if im.width < 900 or im.height < 1200:
                                  raise RuntimeError(f'Image too small: {im.size}')
                              im.convert('RGB').save(target, 'JPEG', quality=95, optimize=True)
                          print(f'generated {target} ({target.stat().st_size} bytes)')
                          break
                      except Exception as exc:
                          last_error = exc
                          print(f'{npc_id}-{variant} attempt {attempt} failed: {type(exc).__name__}: {exc}')
                          time.sleep(15 * attempt)
                          client = Client('black-forest-labs/FLUX.1-schnell', httpx_kwargs={'timeout': 300.0})
                  else:
                      raise SystemExit(f'failed to generate {npc_id}-{variant}: {last_error}')
                  time.sleep(3)
          PY

      - name: Validate candidate set
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          files = sorted(Path('assets/batch-02-candidates').glob('NPC-*.jpg'))
          assert len(files) == 20, f'expected 20 images, got {len(files)}'
          for path in files:
              assert path.stat().st_size > 45000, f'{path} too small'
              with Image.open(path) as im:
                  assert im.width >= 900 and im.height >= 1200, f'{path}: {im.size}'
                  print(path.name, im.size, path.stat().st_size)
          PY

      - name: Upload candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: npc-art-batch-02-candidates
          path: assets/batch-02-candidates
          if-no-files-found: error
          compression-level: 0
