name: Generate NPC Art Batch 02

on:
  push:
    branches: [main]
    paths:
      - prompts/batch-02.json
      - .github/workflows/generate-batch-02.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Generate NPC-011 to NPC-020
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import subprocess
          import time
          import urllib.parse

          prompts = json.loads(pathlib.Path('prompts/batch-02.json').read_text(encoding='utf-8'))
          out = pathlib.Path('assets/batch-02')
          out.mkdir(parents=True, exist_ok=True)

          def valid_image(path):
              if not path.exists() or path.stat().st_size < 45000:
                  return False
              mime = subprocess.check_output(['file', '-b', '--mime-type', str(path)], text=True).strip()
              return mime in {'image/jpeg', 'image/png', 'image/webp'}

          for index, (npc_id, prompt) in enumerate(prompts.items(), start=1):
              target = out / f'{npc_id}.jpg'
              if valid_image(target):
                  print(f'skip existing {target}')
                  continue

              encoded = urllib.parse.quote(prompt, safe='')
              seed = 8200 + index
              endpoints = [
                  f'https://gen.pollinations.ai/image/{encoded}?model=flux&width=1024&height=1365&seed={seed}',
                  f'https://image.pollinations.ai/prompt/{encoded}?model=flux&width=1024&height=1365&seed={seed}&nologo=true&enhance=true',
                  f'https://pollinations.ai/p/{encoded}?width=1024&height=1365&seed={seed}&nologo=true',
              ]

              success = False
              for round_no in range(1, 5):
                  for endpoint in endpoints:
                      temp = out / f'{npc_id}.part'
                      try:
                          subprocess.run([
                              'curl', '-L', '--fail', '--silent', '--show-error',
                              '--connect-timeout', '30', '--max-time', '360',
                              '--retry', '2', '--retry-delay', '5',
                              '-A', 'Mozilla/5.0', '-o', str(temp), endpoint
                          ], check=True)
                          if valid_image(temp):
                              os.replace(temp, target)
                              print(f'generated {npc_id}: {target.stat().st_size} bytes')
                              success = True
                              break
                          if temp.exists():
                              print(f'invalid response for {npc_id}: {temp.stat().st_size} bytes')
                              temp.unlink()
                      except Exception as exc:
                          print(f'{npc_id} round {round_no} endpoint failed: {exc}')
                          if temp.exists():
                              temp.unlink()
                  if success:
                      break
                  time.sleep(12 * round_no)
              if not success:
                  raise SystemExit(f'failed to generate {npc_id}')
              time.sleep(8)
          PY

      - name: Validate image count and file types
        shell: bash
        run: |
          set -euo pipefail
          count="$(find assets/batch-02 -maxdepth 1 -type f -name 'NPC-*.jpg' | wc -l)"
          echo "image count: $count"
          test "$count" -eq 10
          find assets/batch-02 -maxdepth 1 -type f -name 'NPC-*.jpg' -print0 | xargs -0 file
          find assets/batch-02 -maxdepth 1 -type f -name 'NPC-*.jpg' -size -45k -print | tee /tmp/small.txt
          test ! -s /tmp/small.txt

      - name: Commit generated images
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/batch-02
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'art: generate NPC batch 02 images'
            git push
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: npc-art-batch-02
          path: assets/batch-02
          if-no-files-found: error
          compression-level: 0
