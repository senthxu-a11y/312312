name: Generate NPC Art Batch 02

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/generate-batch-02.yml
  pull_request:
    branches: [main]
    paths:
      - prompts/batch-02.json
      - .github/workflows/generate-batch-02.yml
      - runs/batch-02-trigger.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Install public Space client
        run: python3 -m pip install --quiet --upgrade gradio_client pillow requests

      - name: Diagnostic generation for NPC-011
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import shutil
          import requests
          from PIL import Image
          from gradio_client import Client

          prompts = json.loads(pathlib.Path('prompts/batch-02.json').read_text(encoding='utf-8'))
          base_prompt = prompts['NPC-011']
          out = pathlib.Path('assets/batch-02')
          out.mkdir(parents=True, exist_ok=True)

          providers = [
              ('https://manu994-prithivmlmods-canopus-pixar-3d-flux-lora.hf.space/', 'pixar'),
              ('black-forest-labs/FLUX.1-schnell', 'flux'),
          ]
          last_error = None
          for space, provider_type in providers:
              try:
                  print(f'Connecting to {space}')
                  client = Client(space, httpx_kwargs={'timeout': 180.0})
                  print('API_SCHEMA:', client.view_api(return_format='dict'))
                  if provider_type == 'pixar':
                      prompt = 'Pixar 3D, original mobile game NPC, ' + base_prompt
                      result = client.predict(prompt, api_name='/predict')
                  else:
                      result = client.predict(
                          prompt=base_prompt,
                          seed=8201,
                          randomize_seed=False,
                          width=1024,
                          height=1365,
                          num_inference_steps=4,
                          api_name='/infer',
                      )
                  print('PROVIDER_USED:', space)
                  print('RAW_RESULT:', repr(result))
                  candidate = result[0] if isinstance(result, (tuple, list)) else result
                  if isinstance(candidate, dict):
                      candidate = candidate.get('path') or candidate.get('url')
                  temp = out / 'NPC-011-source'
                  if isinstance(candidate, str) and os.path.exists(candidate):
                      shutil.copy2(candidate, temp)
                  elif isinstance(candidate, str) and candidate.startswith('http'):
                      response = requests.get(candidate, timeout=300)
                      response.raise_for_status()
                      temp.write_bytes(response.content)
                  else:
                      raise RuntimeError(f'Unsupported result: {candidate!r}')

                  with Image.open(temp) as im:
                      print('SOURCE_IMAGE:', im.format, im.size, im.mode)
                      if im.width < 512 or im.height < 512:
                          raise RuntimeError(f'Image too small: {im.size}')
                      im.convert('RGB').save(out / 'NPC-011.jpg', 'JPEG', quality=95, optimize=True)
                  temp.unlink(missing_ok=True)
                  print('Generated assets/batch-02/NPC-011.jpg')
                  break
              except Exception as exc:
                  print(f'{space} failed: {type(exc).__name__}: {exc}')
                  last_error = exc
          else:
              raise SystemExit(f'All public Spaces failed: {last_error}')
          PY

      - name: Validate diagnostic image
        shell: bash
        run: |
          set -euo pipefail
          test -f assets/batch-02/NPC-011.jpg
          file assets/batch-02/NPC-011.jpg
          test "$(stat -c%s assets/batch-02/NPC-011.jpg)" -gt 45000

      - name: Upload diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: npc-art-batch-02-diagnostic
          path: assets/batch-02/NPC-011.jpg
          if-no-files-found: error
          compression-level: 0
